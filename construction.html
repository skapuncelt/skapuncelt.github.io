
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NEW CONTENTS | SkaPunCelt</title>

    <meta name="description" content="SkaPunCeltの新しいコンテンツを制作中です。サイトの更新情報は公式SNSでお知らせします。">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="page-header">
    <a href="index.html">← SkaPunCelt</a>
</header>


<main class="construction-page">

    <!-- =========================
         HERO
    ========================== -->

    <section class="construction-hero">

        <p class="section-label">NEW CONTENTS</p>

        <h1>新コンテンツ<br>建設予定地</h1>

        <p class="construction-lead">
            あれ？迷い込んでもうたんかいな。<br>
            せっかく来てもろたのに、まだ何もないわ。<br>
            ごめんやで、もうちょっと待っててな。
        </p>

    </section>


    <!-- =========================
         SNS
    ========================== -->

    <section class="construction-section sns-section">

        <h2>SNS</h2>

        <p>
            新しいコンテンツが完成した際は、<br>
            各SNSでお知らせします。
        </p>

        <div class="sns-buttons">

            <!-- X -->
            <a
                href="https://x.com/SkaPunCelt"
                target="_blank"
                rel="noopener noreferrer"
                class="sns-button"
            >
                X
            </a>

            <!-- Instagram -->
            <a
                href="https://www.instagram.com/skapuncelt/"
                target="_blank"
                rel="noopener noreferrer"
                class="sns-button"
            >
                Instagram
            </a>

        </div>

    </section>


    <!-- =========================
         COMING SOON
    ========================== -->

    <section class="construction-section">

        <h2>COMING SOON</h2>

        <div class="comingsoon-content">

            <p>
                SkaPunCeltの新しいコンテンツを<br>
                現在制作中です。<br>
                <br>
                SkaPunCeltの活動とともに、<br>
                このサイトも少しずつ進化していきます。
            </p>

        </div>

    </section>


    <!-- =========================
         BOTTOM
    ========================== -->

    <div class="bottom-area">

        <!-- BACK TO HOME -->
        <section class="back-home">
            <a href="index.html">← BACK TO HOME</a>
        </section>


        <!-- Harry Duck -->
        <section class="construction-harryduck">

            <a
                href="#"
                class="harryduck-trigger"
                onclick="showConstructionHarryDuckMessage(); return false;"
            >
                <img src="harryduck.jpg" alt="ハリーダックちゃん">
            </a>

            <p
                id="construction-harryduck-message"
                class="construction-harryduck-message"
            >
                まだまだ増えるで～　......グァ！
            </p>

        </section>

    </div>

</main>


<!-- =========================
     FOOTER
========================= -->

<footer>
    <p>© SkaPunCelt</p>
</footer>


<!-- =========================
     HARRY DUCK SCRIPT
========================= -->

<script>
function showConstructionHarryDuckMessage() {
    const message = document.getElementById("construction-harryduck-message");
    message.classList.toggle("show");
}
</script>


</body>
</html>
